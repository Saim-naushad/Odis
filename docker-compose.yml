services:
  postgres:
    image: postgres:16
    container_name: odis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odis
      POSTGRES_USER: odis
      POSTGRES_PASSWORD: odis
    ports:
      - "5432:5432"
    volumes:
      - odis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odis -d odis -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  odis-postgres-data:
