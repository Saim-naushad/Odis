# ODIS production runtime
#
# Topology: frontend, api, worker, postgres, redis, kafka (KRaft), prometheus, grafana
# Public endpoints: frontend (:8080), api (:8000)
# Internal only: postgres, redis, kafka, worker, prometheus, grafana
#
# Usage:
#   cp .env.example .env   # optional overrides
#   docker compose up --build -d
#
# See docs/platform/docker-runtime.md for architecture and operations.

name: odis

x-odis-environment: &odis-environment
  DATABASE_URL: postgresql+psycopg://odis:odis@postgres:5432/odis
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  REDIS_URL: redis://redis:6379/0
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
  MQTT_API_BASE_URL: http://api:8000
  MQTT_SUBSCRIBE_PATTERN: ${MQTT_SUBSCRIBE_PATTERN:-odis/v1/+/+/telemetry/+}
  MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-odis-mqtt-bridge}
  MQTT_QOS: ${MQTT_QOS:-1}
  MQTT_CLEAN_SESSION: ${MQTT_CLEAN_SESSION:-false}
  WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-30}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
  HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2.0}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}

networks:
  odis-internal:
    driver: bridge

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    networks:
      - odis-internal
    environment:
      POSTGRES_DB: odis
      POSTGRES_USER: odis
      POSTGRES_PASSWORD: odis
    volumes:
      - odis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odis -d odis -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - odis-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    networks:
      - odis-internal
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - odis-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    networks:
      - odis-internal
    volumes:
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - odis-mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    restart: unless-stopped
    networks:
      - odis-internal
    environment:
      <<: *odis-environment
      OTEL_SERVICE_NAME: odis-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
    restart: unless-stopped
    networks:
      - odis-internal
    environment:
      <<: *odis-environment
      OTEL_SERVICE_NAME: odis-worker
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'backend.app.worker_main' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mqtt-bridge:
    build:
      context: .
      dockerfile: infra/docker/mqtt-bridge/Dockerfile
    restart: unless-stopped
    networks:
      - odis-internal
    environment:
      <<: *odis-environment
      OTEL_SERVICE_NAME: odis-mqtt-bridge
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'backend.mqtt_bridge' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks:
      - odis-internal
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    networks:
      - odis-internal
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - odis-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    networks:
      - odis-internal
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - odis-grafana-data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  odis-postgres-data:
  odis-kafka-data:
  odis-mosquitto-data:
  odis-prometheus-data:
  odis-grafana-data:
