services:
  postgres:
    image: postgres:16
    container_name: odis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odis
      POSTGRES_USER: odis
      POSTGRES_PASSWORD: odis
    ports:
      - "5432:5432"
    volumes:
      - odis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odis -d odis -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../../:/app
    command: >
      sh -c "pip install -e . && uvicorn backend.app.main:app
      --host 0.0.0.0 --port 8000 --log-level info"
    environment:
      DATABASE_URL: postgresql+psycopg://odis:odis@postgres:5432/odis
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: odis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  odis-postgres-data:
  prometheus-data:

