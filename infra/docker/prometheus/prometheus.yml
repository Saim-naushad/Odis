global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "odis-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "api:8000"

  - job_name: "odis-fault-inference-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "fault-inference-worker:9108"

  - job_name: "odis-reasoning-bridge-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "reasoning-bridge-worker:9109"

  # Needed for System panels (uptime/process metrics).
  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "prometheus:9090"

