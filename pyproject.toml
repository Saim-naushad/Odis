[project]
name = "odis"
version = "1.0.0"
description = "Operational reasoning platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "kafka-python>=2.0",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "prometheus-client>=0.21",
    "redis>=5.0",
    "uvicorn[standard]>=0.32",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-kafka-python>=0.49b0",
]

[project.urls]
Homepage = "https://github.com/Saim-naushad/Odis"
Repository = "https://github.com/Saim-naushad/Odis"
Documentation = "https://github.com/Saim-naushad/Odis/tree/main/docs"
Changelog = "https://github.com/Saim-naushad/Odis/blob/main/CHANGELOG.md"
Issues = "https://github.com/Saim-naushad/Odis/issues"

[project.scripts]
odis = "odis.cli:main"

[project.optional-dependencies]
forecast = [
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "fakeredis>=2.0",
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require docker compose services",
]

# ---------------------------------------------------------------------------
# Ruff — linting only (formatting deferred to a later PR)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "backend", "tests", "examples"]

[tool.ruff.lint.isort]
known-first-party = [
    "application",
    "backend",
    "domain",
    "infrastructure",
    "odis",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (likely bugs)
    "UP",     # pyupgrade (modern Python syntax)
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # Ruff-specific rules
]
ignore = [
    "SIM108", # ternary operators — often less readable in domain code
]

# Examples manipulate sys.path before importing application code.
[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]

# ---------------------------------------------------------------------------
# MyPy — static type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"

# Practical baseline: catch real errors without requiring full strict mode yet.
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# Application and domain code should be fully typed.
[[tool.mypy.overrides]]
module = ["domain.*", "application.*", "backend.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pydantic_settings", "structlog", "structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kafka"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["paho", "paho.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "opentelemetry",
    "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "onnxruntime"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fakeredis", "fakeredis.*"]
ignore_missing_imports = true
