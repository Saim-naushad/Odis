apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: odis
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: odis
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
