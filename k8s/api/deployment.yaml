apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: odis
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: odis
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: odis
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
        - name: wait-redis
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z redis 6379; do echo waiting for redis; sleep 2; done
        - name: wait-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: api
          image: odis-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: odis-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: odis-postgres
                  key: DATABASE_URL
            - name: OTEL_SERVICE_NAME
              value: odis-api
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
