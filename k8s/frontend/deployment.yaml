apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: odis
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: odis
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: odis
        app.kubernetes.io/component: frontend
    spec:
      initContainers:
        - name: wait-api
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until wget -qO- http://api:8000/live >/dev/null 2>&1; do echo waiting for api; sleep 2; done
      containers:
        - name: frontend
          image: odis-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
