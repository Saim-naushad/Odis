apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: odis
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: odis
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: odis
        app.kubernetes.io/component: worker
    spec:
      initContainers:
        - name: wait-api
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until wget -qO- http://api:8000/live >/dev/null 2>&1; do echo waiting for api; sleep 2; done
      containers:
        - name: worker
          image: odis-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: odis-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: odis-postgres
                  key: DATABASE_URL
            - name: OTEL_SERVICE_NAME
              value: odis-worker
            # Worker constructs the ONNX forecast engine during bootstrap but
            # never serves forecasts. Disable it so the base image needs no
            # forecast deps (numpy, onnx, onnxruntime).
            - name: FORECAST_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f 'backend.app.worker_main' >/dev/null || exit 1
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f 'backend.app.worker_main' >/dev/null || exit 1
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
